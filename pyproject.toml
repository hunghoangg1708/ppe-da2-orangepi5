[build-system]
requires = ["setuptools>=68,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "ppe-da2-orangepi5"
version = "0.1.0"
description = "PPE monitoring on Orange Pi 5 for Do An 2"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==1.26.4",
    "opencv-python-headless>=4.11,<5",
    "pyyaml>=6,<7",
    "setuptools<82",
    "torch==2.4.0",
    "ultralytics==8.4.156",
    "lap>=0.5.12,<1",
    "rknn-toolkit2==2.3.2",
]

[tool.setuptools.packages.find]
include = ["ai*", "app*"]
